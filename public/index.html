<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הקלדה עיוורת בעברית – מבחן הקלדה, שיעורים ותרגול</title>
  <meta name="description" content="למדו הקלדה עיוורת בעברית בחינם: מבחן מהירות הקלדה, 16 שיעורים מדורגים ותרגול חכם שמתמקד במקשים החלשים שלכם.">
  <meta name="theme-color" content="#22272e">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="js/theme-init.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <a class="logo" href="#/" aria-label="הקלדה עיוורת – דף הבית">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M6 9.5h.01M9.5 9.5h.01M13 9.5h.01M16.5 9.5h.01M6 12.5h.01M18 12.5h.01M18 9.5h.01M8 15.5h8"/></svg>
        <span class="logo-text">הקלדה<span>עיוורת</span></span>
      </a>
      <nav class="nav" aria-label="ניווט ראשי">
        <a href="#/test" data-nav="test" title="מבחן הקלדה">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2h5"/></svg>
          <span>מבחן</span>
        </a>
        <a href="#/lessons" data-nav="lessons" title="שיעורי הקלדה">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
          <span>שיעורים</span>
        </a>
        <a href="#/practice" data-nav="practice" title="תרגול">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
          <span>תרגול</span>
        </a>
        <a href="#/profile" data-nav="profile" title="הפרופיל והניתוח שלי">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>
          <span>ניתוח</span>
        </a>
      </nav>
      <div id="user-area" class="user-area"></div>
      <button class="icon-btn" id="theme-toggle" aria-label="החלפת ערכת צבעים" title="מצב כהה / בהיר">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </header>

    <main id="view"></main>

    <footer class="footer">
      <div class="shortcuts">
        <span><kbd>Tab</kbd> התחלה מחדש</span>
        <span><kbd>Esc</kbd> איפוס</span>
      </div>
      <div class="copy">הקלדה עיוורת בעברית · <a href="#/privacy">מדיניות פרטיות</a></div>
    </footer>
  </div>

  <dialog id="auth" class="auth" aria-labelledby="auth-title">
    <div class="auth-body">
      <div class="auth-head">
        <h2 id="auth-title">התחברות</h2>
        <button type="button" class="icon-btn" id="auth-close" aria-label="סגירה">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="auth-hint">התחברו עם חשבון Google כדי לשמור את התוצאות וההתקדמות ולקבל שיעורים מותאמים אישית – בכל מחשב. ההתקדמות שצברתם כאורחים תועבר לחשבון.</p>
      <div id="google-btn" class="google-btn"></div>
      <p class="auth-hint" id="auth-unavailable" hidden>ההתחברות עדיין לא הוגדרה באתר.</p>
      <p class="form-error" id="auth-error" role="alert"></p>
    </div>
  </dialog>

  <script src="js/data.js"></script>
  <script src="js/util.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/text.js"></script>
  <script src="js/account.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
