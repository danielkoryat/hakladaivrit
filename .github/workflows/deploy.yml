# Every push to main: run the tests, apply database migrations, publish to Cloudflare.
# Needs the repository secret CLOUDFLARE_API_TOKEN and variable CLOUDFLARE_ACCOUNT_ID
# (Settings → Secrets and variables → Actions).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Database migrations
        run: npx wrangler d1 migrations apply hakladaivrit --remote

      - name: Deploy
        run: npx wrangler deploy
