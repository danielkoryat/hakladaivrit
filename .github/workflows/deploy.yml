# Every push to main: run the tests, apply database migrations, publish to Cloudflare.
# Needs the repository secret CLOUDFLARE_API_TOKEN and variable CLOUDFLARE_ACCOUNT_ID
# (Settings → Secrets and variables → Actions).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Check Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Database migrations
        run: npx wrangler d1 migrations apply hakladaivrit --remote

      - name: Deploy
        run: npx wrangler deploy

      # Tell Bing (and through it ChatGPT search, Copilot, DuckDuckGo) and Yandex which pages changed.
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        env:
          INDEXNOW_KEY: 5d282cb84ed7fd9c20e5d623a15b306b
        run: |
          sleep 20
          curl -fsS https://hakladaivrit.com/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed -e 's/<loc>//' -e 's#</loc>##' > urls.txt
          jq -n --arg key "$INDEXNOW_KEY" --rawfile urls urls.txt \
            '{host: "hakladaivrit.com", key: $key, keyLocation: ("https://hakladaivrit.com/" + $key + ".txt"), urlList: ($urls | split("\n") | map(select(length > 0)))}' > indexnow.json
          echo "Submitting $(jq '.urlList | length' indexnow.json) URLs"
          curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
            --data @indexnow.json -o /dev/null -w 'IndexNow response: %{http_code}\n'
